<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1600 900" width="1600" height="900"
     role="img" aria-label="Illustration of the Seattle skyline at dusk with the Space Needle">
  <defs>
    <linearGradient id="sky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#070f28"/>
      <stop offset="34%"  stop-color="#132a60"/>
      <stop offset="62%"  stop-color="#3c3f85"/>
      <stop offset="82%"  stop-color="#8e5289"/>
      <stop offset="93%"  stop-color="#d2726f"/>
      <stop offset="100%" stop-color="#f0a765"/>
    </linearGradient>

    <radialGradient id="sunglow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0%"   stop-color="#ffd9a0" stop-opacity=".95"/>
      <stop offset="45%"  stop-color="#f2925f" stop-opacity=".45"/>
      <stop offset="100%" stop-color="#f2925f" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="rainier" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#9aa6d8" stop-opacity=".85"/>
      <stop offset="100%" stop-color="#5b5790" stop-opacity=".55"/>
    </linearGradient>

    <linearGradient id="farCity" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2a2f5e"/>
      <stop offset="100%" stop-color="#1b1f45"/>
    </linearGradient>

    <linearGradient id="nearCity" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#141a3b"/>
      <stop offset="100%" stop-color="#0a0e26"/>
    </linearGradient>

    <linearGradient id="needle" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%"   stop-color="#0d1330"/>
      <stop offset="42%"  stop-color="#232a55"/>
      <stop offset="62%"  stop-color="#39406f"/>
      <stop offset="100%" stop-color="#0d1330"/>
    </linearGradient>

    <linearGradient id="water" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"   stop-color="#121a3d"/>
      <stop offset="100%" stop-color="#05081a"/>
    </linearGradient>

    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="7"/>
    </filter>
    <filter id="ripple" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3"/>
    </filter>

    <style>
      .tw { animation: tw 4s ease-in-out infinite; }
      .tw:nth-of-type(3n)   { animation-delay: -1.3s; }
      .tw:nth-of-type(3n+1) { animation-delay: -2.6s; }
      @keyframes tw { 0%,100% { opacity:.25 } 50% { opacity:.9 } }
      @media (prefers-reduced-motion: reduce) { .tw { animation: none; opacity:.6 } }
    </style>
  </defs>

  <rect width="1600" height="900" fill="url(#sky)"/>

  <!-- stars -->
  <g fill="#ffffff">
    <circle class="tw" cx="120"  cy="70"  r="1.7"/><circle class="tw" cx="300" cy="140" r="1.3"/>
    <circle class="tw" cx="470"  cy="60"  r="1.9"/><circle class="tw" cx="640" cy="120" r="1.2"/>
    <circle class="tw" cx="760"  cy="48"  r="1.6"/><circle class="tw" cx="980" cy="96"  r="1.4"/>
    <circle class="tw" cx="1140" cy="52"  r="1.8"/><circle class="tw" cx="1320" cy="128" r="1.3"/>
    <circle class="tw" cx="1480" cy="74"  r="1.6"/><circle class="tw" cx="210"  cy="210" r="1.1"/>
    <circle class="tw" cx="1400" cy="205" r="1.2"/><circle class="tw" cx="560"  cy="220" r="1.0"/>
    <circle class="tw" cx="1230" cy="168" r="1.1"/><circle class="tw" cx="60"   cy="150" r="1.2"/>
  </g>

  <!-- setting sun -->
  <ellipse cx="300" cy="690" rx="420" ry="260" fill="url(#sunglow)"/>
  <circle cx="300" cy="688" r="46" fill="#ffc98a" opacity=".85" filter="url(#soft)"/>

  <!-- Mount Rainier, far south -->
  <path d="M1180 700 L1330 520 L1360 546 L1392 512 L1436 556 L1520 640 L1600 700 Z" fill="url(#rainier)"/>
  <path d="M1330 520 L1360 546 L1392 512 L1424 544 L1400 566 L1368 552 L1342 570 Z" fill="#e8ecff" opacity=".75"/>

  <!-- distant skyline -->
  <g fill="url(#farCity)">
    <rect x="60"  y="612" width="54"  height="150"/>
    <rect x="128" y="578" width="40"  height="184"/>
    <rect x="182" y="630" width="62"  height="132"/>
    <rect x="1290" y="622" width="58" height="140"/>
    <rect x="1362" y="596" width="44" height="166"/>
    <rect x="1420" y="640" width="70" height="122"/>
    <rect x="1504" y="608" width="52" height="154"/>
  </g>

  <!-- ==================== Space Needle ==================== -->
  <g>
    <!-- halo glow behind the tophouse -->
    <ellipse cx="880" cy="292" rx="150" ry="52" fill="#ffc98a" opacity=".22" filter="url(#soft)"/>

    <!-- tripod legs -->
    <path d="M782 762 Q838 556 862 330 L874 330 Q856 556 808 762 Z" fill="url(#needle)"/>
    <path d="M978 762 Q922 556 898 330 L886 330 Q904 556 952 762 Z" fill="url(#needle)"/>
    <!-- centre core -->
    <path d="M866 762 L870 330 L890 330 L894 762 Z" fill="#0f1534"/>
    <!-- leg cross-bracing -->
    <g stroke="#2b3164" stroke-width="3" opacity=".8">
      <path d="M828 620 L932 620"/><path d="M846 500 L914 500"/><path d="M858 410 L902 410"/>
    </g>

    <!-- tophouse: underside cone, disc, roof, mast -->
    <path d="M856 336 L784 302 L976 302 L904 336 Z" fill="#161c40"/>
    <path d="M780 278 L980 278 L976 302 L784 302 Z" fill="#232a55"/>
    <path d="M792 254 L968 254 L980 278 L780 278 Z" fill="#1a2047"/>
    <path d="M830 228 L930 228 L968 254 L792 254 Z" fill="#141a3b"/>
    <path d="M871 228 L875 176 L885 176 L889 228 Z" fill="#161c40"/>
    <path d="M878 176 L882 176 L881 138 L879 138 Z" fill="#232a55"/>
    <circle cx="880" cy="134" r="4" fill="#ff8a7a"/>
    <circle cx="880" cy="134" r="9" fill="#ff8a7a" opacity=".45" filter="url(#glow)"/>

    <!-- lit observation deck -->
    <rect x="782" y="280" width="196" height="9" fill="#ffd9a0" opacity=".9"/>
    <rect x="782" y="280" width="196" height="9" fill="#ffd9a0" opacity=".5" filter="url(#glow)"/>
    <g fill="#ffe7bd" opacity=".95">
      <rect x="800" y="291" width="9" height="8"/><rect x="822" y="291" width="9" height="8"/>
      <rect x="844" y="291" width="9" height="8"/><rect x="866" y="291" width="9" height="8"/>
      <rect x="888" y="291" width="9" height="8"/><rect x="910" y="291" width="9" height="8"/>
      <rect x="932" y="291" width="9" height="8"/><rect x="954" y="291" width="9" height="8"/>
    </g>
  </g>

  <!-- downtown, nearer -->
  <g fill="url(#nearCity)">
    <rect x="250" y="560" width="76"  height="202"/>
    <rect x="336" y="500" width="58"  height="262"/>
    <path d="M404 470 L404 762 L470 762 L470 470 L437 434 Z"/>
    <rect x="480" y="540" width="70"  height="222"/>
    <rect x="560" y="592" width="52"  height="170"/>
    <rect x="622" y="516" width="64"  height="246"/>
    <rect x="1000" y="556" width="66" height="206"/>
    <rect x="1076" y="604" width="48" height="158"/>
    <rect x="1134" y="534" width="72" height="228"/>
    <rect x="1216" y="596" width="56" height="166"/>
    <rect x="120" y="660" width="60"  height="102"/>
  </g>

  <!-- office lights -->
  <g fill="#ffdca8">
    <g class="tw"><rect x="264" y="578" width="8" height="10"/><rect x="286" y="602" width="8" height="10"/><rect x="308" y="578" width="8" height="10"/></g>
    <g class="tw"><rect x="350" y="520" width="8" height="10"/><rect x="372" y="556" width="8" height="10"/><rect x="350" y="592" width="8" height="10"/></g>
    <g class="tw"><rect x="418" y="492" width="8" height="10"/><rect x="444" y="528" width="8" height="10"/><rect x="418" y="566" width="8" height="10"/></g>
    <g class="tw"><rect x="496" y="562" width="8" height="10"/><rect x="522" y="598" width="8" height="10"/></g>
    <g class="tw"><rect x="636" y="540" width="8" height="10"/><rect x="660" y="580" width="8" height="10"/><rect x="636" y="620" width="8" height="10"/></g>
    <g class="tw"><rect x="1014" y="578" width="8" height="10"/><rect x="1040" y="614" width="8" height="10"/></g>
    <g class="tw"><rect x="1148" y="556" width="8" height="10"/><rect x="1176" y="596" width="8" height="10"/><rect x="1148" y="636" width="8" height="10"/></g>
  </g>

  <!-- Elliott Bay -->
  <rect x="0" y="762" width="1600" height="138" fill="url(#water)"/>
  <rect x="0" y="761" width="1600" height="2" fill="#7f8dc4" opacity=".28"/>
  <g filter="url(#ripple)">
    <g fill="#ffc98a" opacity=".34">
      <rect x="246" y="778" width="118" height="4"/><rect x="272" y="802" width="72" height="4"/>
      <rect x="256" y="828" width="96" height="4"/><rect x="288" y="854" width="52" height="4"/>
    </g>
    <g fill="#9db0ff" opacity=".26">
      <rect x="836" y="784" width="88" height="4"/><rect x="852" y="810" width="56" height="4"/>
      <rect x="844" y="838" width="70" height="4"/><rect x="860" y="864" width="40" height="4"/>
    </g>
  </g>
</svg>
